<script type='text/javascript'>
    //<![CDATA[
    $(window).load(function () {
        var audio;
        var playlist;
        var tracks;
        var current;

        init();
        function init() {
            current = 0;
            audio = $('audio');
            playlist = $('#playlist');
            tracks = playlist.find('li a');
            len = tracks.length - 1;
            audio[0].volume = 1;
            audio[0].play();
            playlist.find('a').click(function (e) {
                e.preventDefault();
                link = $(this);
                current = link.parent().index();
                run(link, audio[0]);
            });
            audio[0].addEventListener('ended', function (e) {
                current++;
                if (current == len) {
                    current = 0;
                    link = playlist.find('a')[0];
                } else {
                    link = playlist.find('a')[current];
                }
                run($(link), audio[0]);
            });
        }
        function run(link, player) {
            player.src = link.attr('href');
            par = link.parent();
            par.addClass('active').siblings().removeClass('active');
            audio[0].load();
            audio[0].play();
        }
    });//]]> 

    $(function () {

            } else {
                this.src = this.src.replace("_nsfw", "_sfw");
            }
            $(this).toggleClass("on");
        });
    });


</script>
